services:
  postgres-iam:
    image: postgres:18-alpine
    container_name: mds-postgres-iam
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - postgres_iam_data:/var/lib/postgresql

volumes:
  postgres_data:
  postgres_iam_data:
